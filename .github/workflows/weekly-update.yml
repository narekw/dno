name: Weekly data update

on:
  schedule:
    # каждый понедельник в 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}   # позволяет запускать вручную кнопкой на GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run update script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-data.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "doomsday-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "auto: weekly data update"
          git push
